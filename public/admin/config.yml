# =========================================================
# DECAP CMS — Configuração KCIN Editoria
# =========================================================
# Painel admin pra editar livros, capas, links sem mexer no código.
# Acesso: kcineditoria.com.br/admin (após deploy)
# =========================================================

backend:
  name: github
  repo: Kcinom/kcin-editoria
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "public/capas"
public_folder: "/capas"

locale: 'pt'

publish_mode: simple

collections:

  - name: "livros"
    label: "📚 Livros"
    label_singular: "Livro"
    folder: "src/content/livros"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ['title', 'series', 'volume', 'genre']
    view_filters:
      - label: "Dark Romantasy"
        field: genre
        pattern: "romantasy"
      - label: "Fantasy Oriental"
        field: genre
        pattern: "fantasy-eastern"
      - label: "Sci-fi"
        field: genre
        pattern: "scifi"
      - label: "Romance"
        field: genre
        pattern: "romance"
      - label: "Fanfics Wattpad"
        field: isWattpad
        pattern: "true"
    
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Subtítulo (opcional)", name: "subtitle", widget: "string", required: false}
      - {label: "Slug (URL)", name: "slug", widget: "string", hint: "URL amigável. Ex: sussurro-do-dragao-i"}
      - {label: "Capa", name: "cover", widget: "image"}
      
      - label: "Gênero"
        name: "genre"
        widget: "select"
        options:
          - {label: "Dark Romantasy", value: "romantasy"}
          - {label: "Fantasia Oriental", value: "fantasy-eastern"}
          - {label: "Fantasia Literária", value: "fantasy-lit"}
          - {label: "Ficção Científica", value: "scifi"}
          - {label: "Steampunk", value: "steampunk"}
          - {label: "Romance", value: "romance"}
          - {label: "Não-ficção", value: "nonfiction"}
      
      - {label: "Série (opcional)", name: "series", widget: "string", required: false}
      - {label: "Volume", name: "volume", widget: "number", required: false, value_type: "int", min: 1}
      
      - label: "Sinopse curta"
        name: "shortSynopsis"
        widget: "text"
        required: false
      
      - label: "Sinopse completa"
        name: "synopsis"
        widget: "markdown"
        required: false
      
      - label: "Link Amazon"
        name: "amazonLink"
        widget: "string"
        required: false
        hint: "Cole o link Amazon quando publicar"
      
      - label: "Link Wattpad"
        name: "wattpadLink"
        widget: "string"
        required: false
      
      - label: "É fanfic no Wattpad?"
        name: "isWattpad"
        widget: "boolean"
        required: false
        default: false
      
      - label: "Status"
        name: "status"
        widget: "select"
        default: "vigente"
        options:
          - {label: "Vigente — com continuação prevista", value: "vigente"}
          - {label: "Livro único / standalone", value: "standalone"}
          - {label: "Série completa", value: "completa"}
          - {label: "Descontinuada (sem continuação)", value: "descontinuada"}
          - {label: "Em produção (não lançado)", value: "producao"}
      
      - label: "Ordem de exibição"
        name: "order"
        widget: "number"
        required: false
        value_type: "int"

  - name: "config"
    label: "⚙️ Configurações"
    delete: false
    editor:
      preview: false
    files:
      
      - name: "home"
        label: "Home — Textos"
        file: "src/content/config/home.md"
        fields:
          - {label: "Subtítulo da logo", name: "tagline", widget: "string"}
          - {label: "Descrição principal", name: "description", widget: "text"}
          - {label: "Sub-descrição (itálico)", name: "subDescription", widget: "string"}
      
      - name: "sobre"
        label: "Sobre"
        file: "src/content/config/sobre.md"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Conteúdo", name: "body", widget: "markdown"}
      
      - name: "contato"
        label: "Contato"
        file: "src/content/config/contato.md"
        fields:
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Instagram", name: "instagram", widget: "string", required: false}
          - {label: "TikTok", name: "tiktok", widget: "string", required: false}
          - {label: "Wattpad", name: "wattpad", widget: "string", required: false}
          - {label: "Amazon Author Page", name: "amazon", widget: "string", required: false}

  - name: "universos"
    label: "🌍 Universos (fanservice)"
    label_singular: "Universo"
    folder: "src/content/universos"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome", name: "name", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Mapa", name: "map", widget: "image", required: false}
      - {label: "Conteúdo", name: "body", widget: "markdown", required: false}

  - name: "personagens"
    label: "👤 Personagens (fanservice)"
    label_singular: "Personagem"
    folder: "src/content/personagens"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome", name: "name", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Universo", name: "universo", widget: "string"}
      - {label: "Papel", name: "role", widget: "string", required: false}
      - {label: "Imagem", name: "image", widget: "image", required: false}
      - {label: "Bio curta", name: "shortBio", widget: "text"}
      - {label: "Bio completa", name: "fullBio", widget: "markdown", required: false}
      - {label: "Citação", name: "quote", widget: "string", required: false}
      - {label: "Trivia", name: "trivia", widget: "list", required: false}
