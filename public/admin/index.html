<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin KCIN Editoria</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* Loading inicial enquanto Decap carrega */
    body { margin: 0; background: #0A0612; }
    
    .loading {
      position: fixed;
      inset: 0;
      background: #0A0612;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      color: #D4A574;
      font-family: 'Georgia', serif;
      z-index: 99999;
    }
    
    .loading-logo {
      height: 60px;
      filter: invert(74%) sepia(33%) saturate(456%) hue-rotate(347deg) brightness(96%) contrast(89%);
    }
    
    .loading-text {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      opacity: 0.7;
    }
    
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(212, 165, 116, 0.2);
      border-top-color: #D4A574;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <img src="/logo-kcin.svg" alt="KCIN" class="loading-logo" />
    <div class="loading-spinner"></div>
    <div class="loading-text">Painel Administrativo</div>
  </div>
  
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Esconde loading quando Decap carregar
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) loading.style.opacity = '0';
        setTimeout(() => {
          if (loading) loading.style.display = 'none';
        }, 500);
      }, 1500);
    });
  </script>
</body>
</html>
